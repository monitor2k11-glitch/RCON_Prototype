const isCol=e=>e.type.startsWith('COLUMN');
function adj(level){const s={},p={};M.e.forEach(e=>{if((level=='column')!=isCol(e)||e.op=='REFERENCES')return;(s[e.source]??=new Set).add(e.target);(p[e.target]??=new Set).add(e.source)});return{s,p}}
function bfs(key,depth,dir,level){const a=adj(level)[dir=='down'?'s':'p'],seen={[key]:0},q=[key];while(q.length){const u=q.shift();if(seen[u]>=depth)continue;for(const v of a[u]||[])if(!(v in seen)){seen[v]=seen[u]+1;q.push(v)}}return seen}
const sev=d=>d<=1?'Critical':d<=2?'High':d<=5?'Medium':'Low',lvl=k=>M.n[k].type=='COLUMN'?'column':'table';
function impact(k){const r=bfs(k,99,'down',lvl(k));return Object.entries(r).filter(([x])=>x!=k).map(([x,d])=>({key:x,name:M.n[x].name,type:M.n[x].type,depth:d,sev:sev(d)})).sort((a,b)=>a.depth-b.depth||a.name.localeCompare(b.name))}
function cycles(){const{s}=adj('table'),skip=k=>['TEMP_TABLE','CTE'].includes(M.n[k]?.type),idx={},low={},on=new Set,st=[],out=[];let i=0;
 const go=v=>{idx[v]=low[v]=i++;st.push(v);on.add(v);for(const w of s[v]||[]){if(skip(w))continue;if(!(w in idx)){go(w);low[v]=Math.min(low[v],low[w])}else if(on.has(w))low[v]=Math.min(low[v],idx[w])}
  if(low[v]==idx[v]){const c=[];let w;do{w=st.pop();on.delete(w);c.push(w)}while(w!=v);if(c.length>1)out.push(c)}};Object.keys(s).filter(k=>!skip(k)&&!(k in idx)).forEach(go);return out}
function health(){const r=M.issues.map(i=>({type:i.type,object:i.obj,detail:i.detail,action:ACTION[i.type]}));
 for(const k in M.steps)M.steps[k].forEach(s=>{if(s.status!='PARSED_FULL'||s.warn.length)r.push({type:s.status,object:M.n[k].name,detail:(s.warn[0]||s.sql.slice(0,100))+` [stmt ${s.idx}, line ${s.line}]`,action:ACTION[s.status]||'Review'})});
 Object.values(M.n).filter(n=>n.type=='UNRESOLVED').forEach(n=>r.push({type:'UNRESOLVED_OBJECT',object:n.name,detail:'Referenced but not defined',action:ACTION.UNRESOLVED_OBJECT}));
 M.cycles.forEach(c=>r.push({type:'CIRCULAR_DEPENDENCY',object:c.map(k=>M.n[k].name).join(' ↔ '),detail:'Cycle in table-level lineage',action:ACTION.CIRCULAR_DEPENDENCY}));
 const a=adj('table');Object.values(M.n).filter(n=>['TABLE','VIEW','PROCEDURE'].includes(n.type)&&!a.s[n.key]&&!a.p[n.key]).forEach(n=>r.push({type:'ORPHAN_OBJECT',object:n.name,detail:'No lineage edges',action:ACTION.ORPHAN_OBJECT}));return r}
